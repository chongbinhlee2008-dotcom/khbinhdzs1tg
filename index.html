<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Injetor Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070b08;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* HẠT KIM TUYẾN LẤP LÁNH MÀU XANH LÁ RƠT TỪ TRÊN XUỐNG */
        .sparkle {
            position: absolute;
            top: -15px;
            background: radial-gradient(circle, #ffffff 0%, #00e676 70%, rgba(0,230,118,0) 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: fallAnimation linear infinite;
            box-shadow: 0 0 8px #ffffff, 0 0 12px #00e676;
            z-index: 99;
        }

        @keyframes fallAnimation {
            0% { transform: translateY(-10px) translateX(0) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(105vh) translateX(30px) scale(1.2); opacity: 0; }
        }

        .phone-frame {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            max-height: 840px;
            background: #0d1410;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        @media (min-width: 450px) {
            .phone-frame {
                border-radius: 42px;
                height: 820px;
                border: 10px solid #14221a;
            }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            padding: 24px 20px;
            background: #0d1410;
            overflow-y: auto;
            z-index: 2;
        }

        .screen.active {
            display: flex;
        }

        /* Màn hình 1: Đăng nhập */
        .login-hero {
            text-align: center;
            margin-top: 45px;
            margin-bottom: 30px;
        }

        .app-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #00e676 0%, #00793c 100%);
            border-radius: 20px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 230, 118, 0.4);
        }

        .login-hero h1 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }

        .login-hero p {
            font-size: 12px;
            color: #8bb09a;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #8bb09a;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-box {
            background: #141f18;
            border: 1.5px solid #1f3326;
            border-radius: 12px;
        }

        .input-box input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-row input {
            display: none;
        }

        .custom-check {
            width: 18px;
            height: 18px;
            background: #141f18;
            border: 1.5px solid #1f3326;
            border-radius: 5px;
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .checkbox-row input:checked ~ .custom-check {
            background: #00e676;
            border-color: #00e676;
        }

        .custom-check::after {
            content: '';
            width: 4px;
            height: 8px;
            border: solid #0d1410;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            display: none;
        }

        .checkbox-row input:checked ~ .custom-check::after {
            display: block;
        }

        .checkbox-text {
            font-size: 13px;
            color: #b0c5b8;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-green {
            background: linear-gradient(135deg, #00e676 0%, #00a854 100%);
            color: #0d1410;
            box-shadow: 0 6px 16px rgba(0, 230, 118, 0.35);
        }

        .error-toast {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: #00e676;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            margin-top: 14px;
            display: none;
        }

        /* Màn hình 2: Chọn ứng dụng (Dashboard) */
        .dash-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .dash-title h2 {
            font-size: 15px;
            font-weight: 800;
        }

        .dash-title p {
            font-size: 10px;
            color: #8bb09a;
        }

        .scan-btn-row {
            margin-bottom: 15px;
        }

        .btn-scan {
            width: 100%;
            background: #141f18;
            border: 1px solid #1f3326;
            color: #00e676;
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .app-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 20px;
        }

        .app-row {
            background: #131f18;
            border: 1px solid #1f3326;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .app-row:active {
            border-color: #00e676;
        }

        .app-row-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            overflow: hidden;
            background: #1c2e22;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .app-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-info h4 {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1px;
        }

        .app-info span {
            font-size: 10px;
            color: #8bb09a;
        }

        .app-action-icon {
            width: 24px;
            height: 24px;
            background: rgba(0, 230, 118, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00e676;
            font-size: 11px;
        }

        /* Màn hình 3: Tiêm file */
        .screen-topbar {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

            border: 1px solid #1f3326;
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
