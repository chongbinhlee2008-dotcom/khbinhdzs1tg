<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { background: #07080b; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .box { width: 85%; max-width: 320px; background: #0d0f17; padding: 20px; border-radius: 16px; border: 1px solid #202638; text-align: center; }
        input[type="text"] { width: 100%; padding: 12px; background: #141824; border: 1px solid #202638; border-radius: 8px; color: #fff; margin-bottom: 12px; outline: none; box-sizing: border-box; }
        .row { display: flex; align-items: center; margin-bottom: 15px; font-size: 13px; color: #8b90a0; text-align: left; }
        .row input { width: auto; margin-right: 8px; margin-bottom: 0; }
        button { width: 100%; padding: 12px; background: #e53935; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .error { color: #ff5252; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h3>Injetor de Xit</h3>
    <input type="text" id="k" placeholder="Chave de acesso">
    <label class="row">
        <input type="checkbox" id="r"> Lembrar chave
    </label>
    <button onclick="check()">Entrar</button>
    <div id="e" class="error">Chave incorreta!</div>
</div>

<script>
    window.onload = function() {
        if(localStorage.getItem('saved_k')) {
            document.getElementById('k').value = localStorage.getItem('saved_k');
            document.getElementById('r').checked = true;
        }
    }
    function check() {
        let val = document.getElementById('k').value.trim();
        let rem = document.getElementById('r').checked;
        if(val === '123') {
            if(rem) { localStorage.setItem('saved_k', val); }
            else { localStorage.removeItem('saved_k'); }
            alert('Thành công!');
        } else {
            document.getElementById('e').style.display = 'block';
        }
    }
</script>

</body>
</html>
